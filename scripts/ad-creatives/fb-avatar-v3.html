<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:1024px}
  body{
    background: linear-gradient(160deg, #072e33 0%, #04181b 62%, #031114 100%);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .grid{position:absolute;inset:0;opacity:.04;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:104px 104px;}
</style>
</head>
<body>
  <div class="grid"></div>
  <svg width="1024" height="1024" viewBox="0 0 1024 1024">
    <!-- Escudo sólido -->
    <path d="M512 104 C 668 104 768 146 768 146 C 768 440 682 658 512 786 C 342 658 256 440 256 146 C 256 146 356 104 512 104 Z"
          fill="#86ecc6"/>
    <!-- V recortada -->
    <path d="M338 300 L512 618 L686 300 L600 300 L512 452 L424 300 Z"
          fill="#051d21"/>
  </svg>
</body>
</html>
